<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <title>Tic-tac-toe</title>
</head>
<body>
    <h1>Tic-tac-toe!</h1>
    <div class="player-input">
        <p>Define two players and the gameboard is enabled!</p>
        <label for="player-input">Player 1</label>
        <input type="text" name="player-input">
        <button class="submit-player">Enter</button>
    </div>
    <div class="play-screen">
        <div class="player-one"></div>
        <div id="board">
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
            <div class="cell" id="9"></div>
        </div>
        <div class="player-two"></div>
    </div>
    <p class="result"></span>
</body>
</html>
